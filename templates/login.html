<!DOCTYPE html>
<html>

<head>
    <title>QuickCart | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1 style="text-align:center; color: var(--accent); margin-top: 50px; font-family: 'Fraunces', Georgia, serif;">
        QuickCart
    </h1>

    <div class="container">

        <h2>Login</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label>Email:</label><br>

            <input type="text"
                   name="email"
                   id="email">

            <br><br>

            <label>Password:</label><br>

            <input type="password"
                   name="password"
                   id="password">

            <br><br>

            <button type="submit"
                    id="login">
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="/register"
               id="registerLink">
                Create one
            </a>
        </p>

    </div>

</body>

</html>
