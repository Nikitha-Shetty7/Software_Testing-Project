<!DOCTYPE html>
<html>
<head>
  <title>QuickCart | Orders</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="navbar">
    <h2><a href="/home" style="color:white;text-decoration:none;">QuickCart</a></h2>
    <div class="nav-right">
      <a href="/wishlist" id="wishlist">Wishlist</a>
            <a href="/cart" id="cart">Cart</a>
      <a href="/login" id="logout">Logout</a>
    </div>
  </div>

  <h2>My Orders</h2>

  {% if orders %}
    <table border="1" cellpadding="10" style="border-collapse:collapse; margin:20px;">
      <tr>
        <th>Order ID</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Payment</th>
        <th></th>
      </tr>
      {% for order in orders %}
      <tr id="order-{{ order.id }}">
        <td>{{ order.id }}</td>
        <td>Rs. {{ order.total }}</td>
        <td id="status-{{ order.id }}">{{ order.status }}</td>
        <td>{{ order.payment_status }}</td>
        <td><a href="/order/{{ order.id }}" id="viewOrder-{{ order.id }}">View Details</a></td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p id="noOrders">You have no orders yet.</p>
  {% endif %}
</body>
</html>
