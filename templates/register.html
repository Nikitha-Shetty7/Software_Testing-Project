<!DOCTYPE html>
<html>
<head>
    <title>QuickCart | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1 style="text-align:center; color: var(--accent); margin-top: 50px; font-family: 'Fraunces', Georgia, serif;">
        QuickCart
    </h1>

    <div class="container">
        <h2>Create Account</h2>

        {% if error %}
          <p class="error" id="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
          <label>Name:</label>
          <input type="text" name="name" id="name" value="{{ name or '' }}">

          <label>Email:</label>
          <input type="text" name="email" id="email" value="{{ email or '' }}">

          <label>Password:</label>
          <input type="password" name="password" id="password">

          <label>Confirm Password:</label>
          <input type="password" name="confirm_password" id="confirm_password">

          <button type="submit" id="registerBtn">Register</button>
        </form>

        <p>Already have an account? <a href="/login" id="loginLink">Login</a></p>
    </div>

</body>
</html>
